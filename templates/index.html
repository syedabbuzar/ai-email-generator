<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Automation</title>

    <link rel="stylesheet" href="static/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>AI Email Automation</h1>

        <p class="subtitle">
            Generate and send professional internship emails using AI.
        </p>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter Student Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter Student Email"
                required
            >

            <input
                type="text"
                name="course"
                placeholder="Enter Course Name"
                required
            >

            <input
                type="text"
                name="start_date"
                placeholder="Enter Internship Start Date"
                required
            >

            <button type="submit">
                Generate & Send Email
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

    </div>

</div>

</body>
</html>
